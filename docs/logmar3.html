<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogMAR Chart - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow: auto;
        }

        #chart-container {
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-sizing: border-box;
            min-height: 400px;
        }

        #chart-container:empty::before {
            content: "Loading chart...";
            display: block;
            text-align: center;
            color: #666;
            padding: 50px 20px;
            font-style: italic;
        }

        .logmar-row {
            display: flex;
            width: 100%;
            align-items: center;
            margin-bottom: 5px;
        }

        .acuity-label {
            padding-right: 10px;
            margin-right: 10px;
            border-right: 1px solid;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            width: 80px;
            flex-shrink: 0;
            text-align: right;
            height: 100%;
        }

        .letters-container {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: center;
            flex-wrap: nowrap;
            overflow: hidden;
            padding: 5px 0;
        }

        .snellen-value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .logmar-value {
            font-size: 0.9em;
        }

        .logmar-letter {
            font-family: 'Optician Sans', Arial, sans-serif;
            font-weight: bold;
            text-align: center;
            flex: 0 0 auto;
            padding: 0 0.2em;
            line-height: 1;
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: #ef4444;
            background: #fef2f2;
            border-radius: 8px;
            margin: 20px;
        }

        /* Print Styles */
        @media print {
            @page {
                size: A4;
                margin: 15mm;
            }

            body {
                background: #fff !important;
                color: #000 !important;
            }

            .header,
            .error-message {
                display: none !important;
            }

            #chart-container {
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            .logmar-row {
                page-break-inside: avoid !important;
            }

            .acuity-label {
                border-right-color: #000 !important;
                color: #000 !important;
            }

            .snellen-value,
            .logmar-value {
                color: #000 !important;
            }

            .logmar-letter {
                color: #000 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>LogMAR Visual Acuity Chart</h1>
        <div class="header-buttons">
            <button onclick="window.history.back()">← Back</button>
            <button onclick="regenerateChart()">🔄 Refresh</button>
        </div>
    </div>

    <div class="content">
        <div id="chart-container"></div>
    </div>

    <script type="module">
        import {
            generateChart,
            loadSettings,
            getTargetCalibrationHeightMm
        } from './helpers/logmar3.js';

        const chartContainer = document.getElementById('chart-container');

        function loadAndDisplayChart() {
            const result = loadSettings();

            if (!result.success) {
                chartContainer.innerHTML = `
                    <div class="error-message">
                        <h3>No Settings Found</h3>
                        <p>Please configure chart settings first.</p>
                        <button onclick="window.history.back()">Go to Settings</button>
                    </div>
                `;
                return;
            }

            const settings = result.settings;
            const chartSettings = {
                distance: parseFloat(settings.distance) || 6,
                letterSetKey: settings.letterSet || 'ETDRS',
                customLettersValue: settings.customLetters || '',
                scalingFactor: parseFloat(settings.scalingFactor) || 1.0,
                letterColor: settings.letterColor || '#000000',
                backgroundColor: settings.backgroundColor || '#ffffff',
                distribution: 'etdrs', // Force ETDRS (5 letters per row) for LogMAR only
                selectedRows: (settings.selectedRows || []).map(v => parseFloat(v)),
                mirrorEffect: settings.mirrorEffect || false
            };

            const result2 = generateChart(chartSettings, chartContainer);

            if (result2.error) {
                chartContainer.innerHTML = `
                    <div class="error-message">
                        <h3>Chart Generation Error</h3>
                        <p>${result2.error}</p>
                        <button onclick="window.history.back()">Go to Settings</button>
                    </div>
                `;
            }
        }

        window.regenerateChart = function () {
            loadAndDisplayChart();
        };

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // Ctrl+P or Cmd+P for Print (browser default, but we can handle it)
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                // Let browser handle print
            }
            // F5, Ctrl+R, or R to refresh chart
            if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r') || e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                regenerateChart();
            }
            // Escape to go back
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // Load chart on page load
        loadAndDisplayChart();
    </script>
</body>

</html>
