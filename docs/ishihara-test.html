<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishihara Color Vision Test - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .plate-counter {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            background: #f5f5f5;
        }

        .plate-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        #ishihara-plate {
            display: block;
            max-width: 90vw;
            max-height: 85vh;
            height: auto;
        }

        @media print {
            .header {
                display: none !important;
            }

            .content {
                padding: 0;
                background: white;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Ishihara Color Vision Test - <span class="plate-counter" id="plate-counter">Plate 1 / 38</span></h1>
        <div class="header-buttons">
            <button onclick="window.history.back()">← Back</button>
            <button id="prev-btn" onclick="previousPlate()">← Previous</button>
            <button id="next-btn" class="primary" onclick="nextPlate()">Next →</button>
        </div>
    </div>

    <div class="content">
        <div class="plate-container">
            <img id="ishihara-plate" src="images/ishihara_plate1.png" alt="Ishihara Plate">
        </div>
    </div>

    <script>
        const plateImg = document.getElementById('ishihara-plate');
        const plateCounter = document.getElementById('plate-counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let currentPlate = 1;
        const totalPlates = 38;

        function updatePlate() {
            // Update image source
            plateImg.src = `images/ishihara_plate${currentPlate}.png`;

            // Update counter
            plateCounter.textContent = `Plate ${currentPlate} / ${totalPlates}`;

            // Update button states
            prevBtn.disabled = currentPlate === 1;
            nextBtn.disabled = currentPlate === totalPlates;
        }

        function nextPlate() {
            if (currentPlate < totalPlates) {
                currentPlate++;
                updatePlate();
            }
        }

        function previousPlate() {
            if (currentPlate > 1) {
                currentPlate--;
                updatePlate();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextPlate();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                previousPlate();
            }
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // Initialize
        updatePlate();
    </script>
</body>

</html>
