<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E Chart - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        #chart-container {
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-sizing: border-box;
            flex: 1;
        }

        #chart-container:empty::before {
            content: "Loading chart...";
            display: block;
            text-align: center;
            color: #666;
            padding: 50px 20px;
            font-style: italic;
        }

        .echart-row {
            display: flex;
            width: 100%;
            align-items: center;
            margin-bottom: 5px;
        }

        .acuity-label {
            padding-left: 10px;
            margin-left: 10px;
            border-left: 1px solid;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 4px;
            width: 80px;
            flex-shrink: 0;
            text-align: left;
            height: 100%;
            order: -1;
        }

        .letters-container {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: center;
            flex-wrap: nowrap;
            overflow: hidden;
            padding: 5px 0;
        }

        .snellen-value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .logmar-value {
            font-size: 0.9em;
        }

        .e-letter {
            font-family: 'Optician Sans', Arial, sans-serif;
            font-weight: bold;
            text-align: center;
            flex: 0 0 auto;
            padding: 0 0.2em;
            line-height: 1;
            display: inline-block;
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: #ef4444;
            background: #fef2f2;
            border-radius: 8px;
            margin: 20px;
        }

        /* Print Styles */
        @media print {
            @page {
                size: A4;
                margin: 15mm;
            }

            body {
                background: #fff !important;
                color: #000 !important;
            }

            .header,
            .error-message {
                display: none !important;
            }

            #chart-container {
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            .echart-row {
                page-break-inside: avoid !important;
            }

            .acuity-label {
                border-right-color: #000 !important;
                color: #000 !important;
            }

            .snellen-value,
            .logmar-value {
                color: #000 !important;
            }

            .e-letter {
                color: #000 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Tumbling E Visual Acuity Chart</h1>
        <div class="header-buttons">
            <button id="horizontal-line-btn">📏 Horizontal Line</button>
            <button id="vertical-line-btn">📐 Vertical Line</button>
            <button id="single-letter-btn">🔤 Single Letter</button>
            <button id="larger-btn" style="display:none;">+ Larger</button>
            <button id="smaller-btn" style="display:none;">- Smaller</button>
            <button id="duochrome-toggle">🔴🟢 Duochrome: OFF</button>
            <button onclick="window.history.back()">← Back</button>
            <button onclick="regenerateChart()">🔄 Refresh</button>
        </div>
    </div>

    <div class="content">
        <div id="chart-container"></div>
    </div>

    <script type="module">
        import {
            loadSettings,
            calculateFontSize,
            logMarToSnellen,
            getContrastColor
        } from './helpers/logmar3.js';

        const chartContainer = document.getElementById('chart-container');

        // E orientations: 0° (right), 90° (down), 180° (left), 270° (up)
        const E_ORIENTATIONS = [0, 90, 180, 270];

        function getRandomOrientation() {
            return E_ORIENTATIONS[Math.floor(Math.random() * E_ORIENTATIONS.length)];
        }

        function generateERow(logMAR, distance, scalingFactor, letterColor, backgroundColor, labelColor, distribution, nextRowFontSize, mirrorEffect = false) {
            const row = document.createElement('div');
            row.classList.add('echart-row');
            row.style.backgroundColor = backgroundColor;

            // Acuity Label
            const labelDiv = document.createElement('div');
            labelDiv.classList.add('acuity-label');
            labelDiv.style.borderRightColor = labelColor;

            const snellenSpan = document.createElement('span');
            snellenSpan.classList.add('snellen-value');
            const snellenResult = logMarToSnellen(logMAR, distance);
            snellenSpan.textContent = typeof snellenResult === 'string' ? snellenResult : snellenResult.primary;
            snellenSpan.style.color = labelColor;

            const logmarSpan = document.createElement('span');
            logmarSpan.classList.add('logmar-value');
            logmarSpan.textContent = `LogMAR: ${logMAR.toFixed(1)}`;
            logmarSpan.style.color = labelColor;

            labelDiv.appendChild(snellenSpan);
            labelDiv.appendChild(logmarSpan);

            // Letters Container
            const lettersContainer = document.createElement('div');
            lettersContainer.classList.add('letters-container');

            // Apply mirror effect: use double distance for calculation (makes letters larger)
            const effectiveDistance = mirrorEffect ? distance * 2 : distance;
            const fontSize = calculateFontSize(logMAR, effectiveDistance, scalingFactor);

            if (nextRowFontSize) {
                const rowSpacing = nextRowFontSize * 0.75;
                row.style.marginTop = `${rowSpacing}pt`;
            }

            // Determine letters per row based on distribution
            let lettersPerRow;
            if (distribution === 'snellen') {
                if (logMAR >= 0.8) lettersPerRow = 1;
                else if (logMAR >= 0.6) lettersPerRow = 2;
                else if (logMAR >= 0.4) lettersPerRow = 3;
                else if (logMAR >= 0.2) lettersPerRow = 4;
                else lettersPerRow = 5;
            } else if (distribution === 'etdrs') {
                lettersPerRow = 5;
            } else if (distribution === 'linear') {
                lettersPerRow = Math.max(1, Math.round((1.0 - logMAR) * 5) + 1);
                lettersPerRow = Math.min(lettersPerRow, 6);
            } else {
                lettersPerRow = 5;
            }

            // Create E letters with random orientations
            for (let i = 0; i < lettersPerRow; i++) {
                const letterSpan = document.createElement('span');
                letterSpan.classList.add('e-letter');
                letterSpan.style.fontSize = `${fontSize.toFixed(2)}pt`;
                letterSpan.style.color = letterColor;
                letterSpan.textContent = 'E';

                // Apply random rotation
                const rotation = getRandomOrientation();
                letterSpan.style.transform = `rotate(${rotation}deg)`;
                letterSpan.style.display = 'inline-block'; // Required for transform to work

                lettersContainer.appendChild(letterSpan);
            }

            row.appendChild(labelDiv);
            row.appendChild(lettersContainer);
            return row;
        }

        function loadAndDisplayChart() {
            const result = loadSettings();

            if (!result.success) {
                chartContainer.innerHTML = `
                    <div class="error-message">
                        <h3>No Settings Found</h3>
                        <p>Please configure chart settings first.</p>
                        <button onclick="window.location.href='logmar-settings.html'">Go to Settings</button>
                    </div>
                `;
                return;
            }

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const letterColor = settings.letterColor || '#000000';
            const backgroundColor = settings.backgroundColor || '#ffffff';
            const distribution = settings.distribution || 'etdrs';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));
            const mirrorEffect = settings.mirrorEffect || false;

            // Validation
            if (selectedRows.length === 0) {
                chartContainer.innerHTML = '<p style="text-align:center; padding: 40px; color: #666;">No rows selected.</p>';
                return;
            }

            chartContainer.style.backgroundColor = backgroundColor;
            chartContainer.innerHTML = ''; // Clear previous chart

            const sortedRows = [...selectedRows].sort((a, b) => b - a);
            const fontSizes = sortedRows.map(logMAR => calculateFontSize(logMAR, distance, scalingFactor));
            const labelColor = getContrastColor(backgroundColor);

            sortedRows.forEach((logMAR, index) => {
                // Only add spacing between rows, not before the first row
                const nextRowFontSize = index > 0 && index + 1 < fontSizes.length ? fontSizes[index + 1] : null;
                const rowElement = generateERow(logMAR, distance, scalingFactor, letterColor, backgroundColor, labelColor, distribution, nextRowFontSize, mirrorEffect);
                chartContainer.appendChild(rowElement);
            });
        }

        window.regenerateChart = function () {
            if (currentMode === 'horizontal') {
                showHorizontalLine();
            } else if (currentMode === 'single') {
                showSingleLetter();
            } else {
                loadAndDisplayChart();
            }
            // Re-apply duochrome if it was enabled
            if (duochromeEnabled) {
                const chartContainer = document.getElementById('chart-container');
                const rows = chartContainer.querySelectorAll('.echart-row');
                const lettersContainers = chartContainer.querySelectorAll('.letters-container');

                if (lettersContainers.length > 0) {
                    const firstContainer = lettersContainers[0];
                    const containerRect = chartContainer.getBoundingClientRect();
                    const lettersRect = firstContainer.getBoundingClientRect();

                    const lettersCenter = lettersRect.left + lettersRect.width / 2 - containerRect.left;
                    const containerWidth = containerRect.width;
                    const centerPercent = (lettersCenter / containerWidth * 100).toFixed(2);

                    chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                }
                rows.forEach(row => row.style.backgroundColor = 'transparent');
            }
        };

        // Duochrome toggle functionality
        let duochromeEnabled = false;
        const duochromeToggle = document.getElementById('duochrome-toggle');

        duochromeToggle.addEventListener('click', function () {
            duochromeEnabled = !duochromeEnabled;
            const chartContainer = document.getElementById('chart-container');
            const rows = chartContainer.querySelectorAll('.echart-row');
            const lettersContainers = chartContainer.querySelectorAll('.letters-container');

            if (duochromeEnabled) {
                // Calculate where the letters-container center is relative to chart-container
                if (lettersContainers.length > 0) {
                    const firstContainer = lettersContainers[0];
                    const containerRect = chartContainer.getBoundingClientRect();
                    const lettersRect = firstContainer.getBoundingClientRect();

                    const lettersCenter = lettersRect.left + lettersRect.width / 2 - containerRect.left;
                    const containerWidth = containerRect.width;
                    const centerPercent = (lettersCenter / containerWidth * 100).toFixed(2);

                    chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                }
                rows.forEach(row => row.style.backgroundColor = 'transparent');
                duochromeToggle.textContent = '🔴🟢 Duochrome: ON';
                duochromeToggle.classList.add('primary');
            } else {
                const result = loadSettings();
                const backgroundColor = result.success ? (result.settings.backgroundColor || '#ffffff') : '#ffffff';
                chartContainer.style.background = backgroundColor;
                rows.forEach(row => row.style.backgroundColor = backgroundColor);
                duochromeToggle.textContent = '🔴🟢 Duochrome: OFF';
                duochromeToggle.classList.remove('primary');
            }
        });

        // Horizontal, Vertical, and Single Letter Mode functionality
        let currentMode = 'normal';
        let currentLogmarIndex = 0;
        let availableLogmars = [];

        const horizontalLineBtn = document.getElementById('horizontal-line-btn');
        const verticalLineBtn = document.getElementById('vertical-line-btn');
        const singleLetterBtn = document.getElementById('single-letter-btn');
        const largerBtn = document.getElementById('larger-btn');
        const smallerBtn = document.getElementById('smaller-btn');

        horizontalLineBtn.addEventListener('click', function () {
            if (currentMode === 'horizontal') {
                currentMode = 'normal';
                largerBtn.style.display = 'none';
                smallerBtn.style.display = 'none';
                horizontalLineBtn.classList.remove('primary');

                chartContainer.style.display = '';
                chartContainer.style.alignItems = '';
                chartContainer.style.justifyContent = '';
                chartContainer.style.minHeight = '';

                loadAndDisplayChart();

                // Re-apply duochrome if it was enabled
                if (duochromeEnabled) {
                    const rows = chartContainer.querySelectorAll('.echart-row');
                    const lettersContainers = chartContainer.querySelectorAll('.letters-container');

                    if (lettersContainers.length > 0) {
                        const firstContainer = lettersContainers[0];
                        const containerRect = chartContainer.getBoundingClientRect();
                        const lettersRect = firstContainer.getBoundingClientRect();

                        const lettersCenter = lettersRect.left + lettersRect.width / 2 - containerRect.left;
                        const containerWidth = containerRect.width;
                        const centerPercent = (lettersCenter / containerWidth * 100).toFixed(2);

                        chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                    }
                    rows.forEach(row => row.style.backgroundColor = 'transparent');
                }
            } else {
                currentMode = 'horizontal';
                currentLogmarIndex = 0;
                showHorizontalLine();
                largerBtn.style.display = 'inline-block';
                smallerBtn.style.display = 'inline-block';
                horizontalLineBtn.classList.add('primary');
                verticalLineBtn.classList.remove('primary');
            }
        });

        verticalLineBtn.addEventListener('click', function () {
            if (currentMode === 'vertical') {
                currentMode = 'normal';
                largerBtn.style.display = 'none';
                smallerBtn.style.display = 'none';
                verticalLineBtn.classList.remove('primary');

                chartContainer.style.display = '';
                chartContainer.style.alignItems = '';
                chartContainer.style.justifyContent = '';
                chartContainer.style.minHeight = '';

                loadAndDisplayChart();

                // Re-apply duochrome if it was enabled
                if (duochromeEnabled) {
                    const rows = chartContainer.querySelectorAll('.echart-row');
                    const lettersContainers = chartContainer.querySelectorAll('.letters-container');

                    if (lettersContainers.length > 0) {
                        const firstContainer = lettersContainers[0];
                        const containerRect = chartContainer.getBoundingClientRect();
                        const lettersRect = firstContainer.getBoundingClientRect();

                        const lettersCenter = lettersRect.left + lettersRect.width / 2 - containerRect.left;
                        const containerWidth = containerRect.width;
                        const centerPercent = (lettersCenter / containerWidth * 100).toFixed(2);

                        chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                    }
                    rows.forEach(row => row.style.backgroundColor = 'transparent');
                }
            } else {
                currentMode = 'vertical';
                showVerticalLine();
                largerBtn.style.display = 'none';
                smallerBtn.style.display = 'none';
                horizontalLineBtn.classList.remove('primary');
                verticalLineBtn.classList.add('primary');
            }
        });

        singleLetterBtn.addEventListener('click', function () {
            if (currentMode === 'single') {
                // Already in single letter mode, go back to normal
                currentMode = 'normal';
                largerBtn.style.display = 'none';
                smallerBtn.style.display = 'none';
                singleLetterBtn.classList.remove('primary');

                chartContainer.style.display = '';
                chartContainer.style.alignItems = '';
                chartContainer.style.justifyContent = '';
                chartContainer.style.minHeight = '';

                loadAndDisplayChart();

                // Re-apply duochrome if it was enabled
                if (duochromeEnabled) {
                    const rows = chartContainer.querySelectorAll('.echart-row');
                    const lettersContainers = chartContainer.querySelectorAll('.letters-container');

                    if (lettersContainers.length > 0) {
                        const firstContainer = lettersContainers[0];
                        const containerRect = chartContainer.getBoundingClientRect();
                        const lettersRect = firstContainer.getBoundingClientRect();

                        const lettersCenter = lettersRect.left + lettersRect.width / 2 - containerRect.left;
                        const containerWidth = containerRect.width;
                        const centerPercent = (lettersCenter / containerWidth * 100).toFixed(2);

                        chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                    }
                    rows.forEach(row => row.style.backgroundColor = 'transparent');
                }
            } else {
                // Switch to single letter mode
                currentMode = 'single';
                currentLogmarIndex = 0;
                showSingleLetter();
                largerBtn.style.display = 'inline-block';
                smallerBtn.style.display = 'inline-block';
                horizontalLineBtn.classList.remove('primary');
                verticalLineBtn.classList.remove('primary');
                singleLetterBtn.classList.add('primary');
            }
        });

        largerBtn.addEventListener('click', function () {
            if (currentMode === 'horizontal' && currentLogmarIndex > 0) {
                currentLogmarIndex--;
                showHorizontalLine();
            } else if (currentMode === 'single' && currentLogmarIndex > 0) {
                currentLogmarIndex--;
                showSingleLetter();
            }
        });

        smallerBtn.addEventListener('click', function () {
            if (currentMode === 'horizontal' && currentLogmarIndex < availableLogmars.length - 1) {
                currentLogmarIndex++;
                showHorizontalLine();
            } else if (currentMode === 'single' && currentLogmarIndex < availableLogmars.length - 1) {
                currentLogmarIndex++;
                showSingleLetter();
            }
        });

        function showHorizontalLine() {
            const result = loadSettings();
            if (!result.success) return;

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const letterColor = settings.letterColor || '#000000';
            const distribution = settings.distribution || 'etdrs';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));

            if (selectedRows.length === 0) return;

            availableLogmars = [...selectedRows].sort((a, b) => b - a);

            if (currentLogmarIndex >= availableLogmars.length) {
                currentLogmarIndex = availableLogmars.length - 1;
            }

            const targetLogMAR = availableLogmars[currentLogmarIndex];

            chartContainer.innerHTML = '';

            // Handle duochrome mode
            if (duochromeEnabled) {
                chartContainer.style.background = 'linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%)';
            } else {
                chartContainer.style.backgroundColor = '#ffffff';
            }

            chartContainer.style.display = 'flex';
            chartContainer.style.alignItems = 'center';
            chartContainer.style.justifyContent = 'center';
            chartContainer.style.minHeight = '100%';

            const labelColor = '#000000';
            const rowElement = generateERow(targetLogMAR, distance, scalingFactor, letterColor, duochromeEnabled ? 'transparent' : '#ffffff', labelColor, distribution, null);
            chartContainer.appendChild(rowElement);
        }

        function showVerticalLine() {
            const result = loadSettings();
            if (!result.success) return;

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const letterColor = settings.letterColor || '#000000';
            const backgroundColor = settings.backgroundColor || '#ffffff';
            const distribution = settings.distribution || 'etdrs';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));

            if (selectedRows.length === 0) return;

            chartContainer.innerHTML = '';

            // Handle duochrome mode
            if (duochromeEnabled) {
                chartContainer.style.background = 'linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%)';
            } else {
                chartContainer.style.backgroundColor = backgroundColor;
            }

            chartContainer.style.display = 'block';

            const sortedRows = [...selectedRows].sort((a, b) => b - a);
            const labelColor = getContrastColor(backgroundColor);

            sortedRows.forEach((logMAR, index) => {
                const row = document.createElement('div');
                row.classList.add('echart-row');
                row.style.backgroundColor = duochromeEnabled ? 'transparent' : backgroundColor;

                const labelDiv = document.createElement('div');
                labelDiv.classList.add('acuity-label');
                labelDiv.style.borderRightColor = labelColor;

                const snellenSpan = document.createElement('span');
                snellenSpan.classList.add('snellen-value');
                const snellenResult = logMarToSnellen(logMAR, distance);
                snellenSpan.textContent = typeof snellenResult === 'string' ? snellenResult : snellenResult.primary;
                snellenSpan.style.color = labelColor;

                const logmarSpan = document.createElement('span');
                logmarSpan.classList.add('logmar-value');
                logmarSpan.textContent = `LogMAR: ${logMAR.toFixed(1)}`;
                logmarSpan.style.color = labelColor;

                labelDiv.appendChild(snellenSpan);
                labelDiv.appendChild(logmarSpan);

                const lettersContainer = document.createElement('div');
                lettersContainer.classList.add('letters-container');

                const fontSize = calculateFontSize(logMAR, distance, scalingFactor);
                const letterSpan = document.createElement('span');
                letterSpan.classList.add('e-letter');
                letterSpan.style.fontSize = `${fontSize.toFixed(2)}pt`;
                letterSpan.style.color = letterColor;
                letterSpan.textContent = 'E';

                const rotation = getRandomOrientation();
                letterSpan.style.transform = `rotate(${rotation}deg)`;
                letterSpan.style.display = 'inline-block';

                lettersContainer.appendChild(letterSpan);
                row.appendChild(labelDiv);
                row.appendChild(lettersContainer);
                chartContainer.appendChild(row);
            });
        }

        function showSingleLetter() {
            const result = loadSettings();
            if (!result.success) return;

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const letterColor = settings.letterColor || '#000000';
            const backgroundColor = settings.backgroundColor || '#ffffff';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));
            const mirrorEffect = settings.mirrorEffect || false;

            if (selectedRows.length === 0) return;

            // Sort from largest to smallest (highest logMAR to lowest)
            availableLogmars = [...selectedRows].sort((a, b) => b - a);

            // Ensure index is within bounds
            if (currentLogmarIndex >= availableLogmars.length) {
                currentLogmarIndex = availableLogmars.length - 1;
            }

            const targetLogMAR = availableLogmars[currentLogmarIndex];

            chartContainer.innerHTML = '';

            // Handle duochrome mode
            if (duochromeEnabled) {
                chartContainer.style.background = 'linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%)';
            } else {
                chartContainer.style.backgroundColor = backgroundColor;
            }

            chartContainer.style.display = 'flex';
            chartContainer.style.alignItems = 'center';
            chartContainer.style.justifyContent = 'center';
            chartContainer.style.minHeight = '100%';

            const labelColor = getContrastColor(backgroundColor);

            // Create single E display
            const row = document.createElement('div');
            row.classList.add('echart-row');
            row.style.backgroundColor = duochromeEnabled ? 'transparent' : backgroundColor;

            // Acuity Label
            const labelDiv = document.createElement('div');
            labelDiv.classList.add('acuity-label');
            labelDiv.style.borderRightColor = labelColor;

            const snellenSpan = document.createElement('span');
            snellenSpan.classList.add('snellen-value');
            const snellenResult = logMarToSnellen(targetLogMAR, distance);
            snellenSpan.textContent = typeof snellenResult === 'string' ? snellenResult : snellenResult.primary;
            snellenSpan.style.color = labelColor;

            const logmarSpan = document.createElement('span');
            logmarSpan.classList.add('logmar-value');
            logmarSpan.textContent = `LogMAR: ${targetLogMAR.toFixed(1)}`;
            logmarSpan.style.color = labelColor;

            labelDiv.appendChild(snellenSpan);
            labelDiv.appendChild(logmarSpan);

            // Single E letter
            const lettersContainer = document.createElement('div');
            lettersContainer.classList.add('letters-container');

            // Apply mirror effect: use double distance for calculation (makes E larger)
            const effectiveDistance = mirrorEffect ? distance * 2 : distance;
            const fontSize = calculateFontSize(targetLogMAR, effectiveDistance, scalingFactor);

            const letterSpan = document.createElement('span');
            letterSpan.classList.add('e-letter');
            letterSpan.style.fontSize = `${fontSize.toFixed(2)}pt`;
            letterSpan.style.color = letterColor;
            letterSpan.textContent = 'E';

            // Apply random orientation and mirror effect
            const rotation = getRandomOrientation();
            if (mirrorEffect) {
                letterSpan.style.transform = `rotate(${rotation}deg) scaleX(-1)`;
            } else {
                letterSpan.style.transform = `rotate(${rotation}deg)`;
            }
            letterSpan.style.display = 'inline-block';

            lettersContainer.appendChild(letterSpan);

            row.appendChild(labelDiv);
            row.appendChild(lettersContainer);
            chartContainer.appendChild(row);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // Arrow keys for navigation in horizontal or single letter mode
            if (currentMode === 'horizontal' || currentMode === 'single') {
                if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentLogmarIndex > 0) {
                        currentLogmarIndex--;
                        if (currentMode === 'horizontal') {
                            showHorizontalLine();
                        } else {
                            showSingleLetter();
                        }
                    }
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (currentLogmarIndex < availableLogmars.length - 1) {
                        currentLogmarIndex++;
                        if (currentMode === 'horizontal') {
                            showHorizontalLine();
                        } else {
                            showSingleLetter();
                        }
                    }
                } else if (e.key === ' ') {
                    e.preventDefault();
                    if (currentMode === 'horizontal') {
                        showHorizontalLine();
                    } else {
                        showSingleLetter();
                    }
                }
            }
            // F5 or Ctrl+R to refresh chart
            if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r')) {
                e.preventDefault();
                regenerateChart();
            }
            // Escape to go back
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // Load chart on page load
        loadAndDisplayChart();
    </script>
</body>

</html>
