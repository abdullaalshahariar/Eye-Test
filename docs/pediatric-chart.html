<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pediatric Chart - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        #chart-container {
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-sizing: border-box;
            flex: 1;
        }

        .symbol-row {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 5px;
        }

        .acuity-label {
            padding-right: 10px;
            margin-right: 10px;
            border-right: 1px solid;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            width: 80px;
            flex-shrink: 0;
            text-align: right;
            height: 100%;
        }

        .symbols-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .snellen-value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .logmar-value {
            font-size: 0.9em;
        }

        .symbol-shape {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            filter: grayscale(100%) brightness(0%);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .symbol-item {
            filter: grayscale(100%) brightness(0%);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: #ef4444;
            background: #fef2f2;
            border-radius: 8px;
            margin: 20px;
        }

        /* SVG shapes */
        svg {
            display: block;
        }

        /* Print Styles */
        @media print {
            @page {
                size: A4;
                margin: 15mm;
            }

            body {
                background: #fff !important;
                color: #000 !important;
            }

            .header,
            .error-message {
                display: none !important;
            }

            #chart-container {
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            .symbol-row {
                page-break-inside: avoid !important;
            }

            .acuity-label {
                border-right-color: #000 !important;
                color: #000 !important;
            }

            .snellen-value,
            .logmar-value {
                color: #000 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Pediatric Visual Acuity Chart</h1>
        <div class="header-buttons"> <button id="horizontal-line-btn">📏 Horizontal Line</button>
            <button id="vertical-line-btn">📐 Vertical Line</button>
            <button id="larger-btn" style="display:none;">+ Larger</button>
            <button id="smaller-btn" style="display:none;">- Smaller</button> <button id="duochrome-toggle">🔴🟢
                Duochrome: OFF</button>
            <button onclick="window.history.back()">← Back</button>
            <button onclick="regenerateChart()">🔄 Refresh</button>
        </div>
    </div>

    <div class="content">
        <div id="chart-container"></div>
    </div>

    <script type="module">
        import {
            loadSettings,
            calculateFontSize,
            logMarToSnellen,
            getContrastColor,
            shuffleArray
        } from './helpers/logmar3.js';

        const chartContainer = document.getElementById('chart-container');

        // Pediatric symbols - simple emojis that children can recognize
        const SYMBOLS = ['❤️', '🏠', '🌙', '☀️', '🍎', '🚗', '✈️', '⚽'];

        function generateSymbolRow(logMAR, distance, scalingFactor, symbolColor, backgroundColor, labelColor, distribution, nextRowFontSize, previousSymbols = null, mirrorEffect = false) {
            const row = document.createElement('div');
            row.classList.add('symbol-row');
            row.style.backgroundColor = backgroundColor;

            // Acuity Label
            const labelDiv = document.createElement('div');
            labelDiv.classList.add('acuity-label');
            labelDiv.style.borderRightColor = labelColor;

            const snellenSpan = document.createElement('span');
            snellenSpan.classList.add('snellen-value');
            const snellenResult = logMarToSnellen(logMAR, distance);
            snellenSpan.textContent = typeof snellenResult === 'string' ? snellenResult : snellenResult.primary;
            snellenSpan.style.color = labelColor;

            const logmarSpan = document.createElement('span');
            logmarSpan.classList.add('logmar-value');
            logmarSpan.textContent = `LogMAR: ${logMAR.toFixed(1)}`;
            logmarSpan.style.color = labelColor;

            labelDiv.appendChild(snellenSpan);
            labelDiv.appendChild(logmarSpan);

            // Symbols Container
            const symbolsContainer = document.createElement('div');
            symbolsContainer.classList.add('symbols-container');

            // Apply mirror effect: use half distance for calculation (makes symbols smaller)
            const effectiveDistance = mirrorEffect ? distance / 2 : distance;
            const fontSize = calculateFontSize(logMAR, effectiveDistance, scalingFactor);

            if (nextRowFontSize) {
                const rowSpacing = nextRowFontSize * 0.75;
                row.style.marginTop = `${rowSpacing}pt`;
            }

            // Determine number of symbols based on distribution
            let numSymbols;
            if (distribution === 'snellen') {
                if (logMAR >= 0.8) numSymbols = 1;
                else if (logMAR >= 0.6) numSymbols = 2;
                else if (logMAR >= 0.4) numSymbols = 3;
                else if (logMAR >= 0.2) numSymbols = 4;
                else numSymbols = 5;
            } else if (distribution === 'etdrs') {
                numSymbols = 5;
            } else if (distribution === 'linear') {
                numSymbols = Math.max(1, Math.round((1.0 - logMAR) * 5) + 1);
                numSymbols = Math.min(numSymbols, 6);
            } else {
                numSymbols = 5;
            }

            // Shuffle and select symbols, ensuring no match with previous row
            let selectedSymbols;
            let attempts = 0;
            const maxAttempts = 100;

            do {
                const shuffledSymbols = shuffleArray([...SYMBOLS]);
                selectedSymbols = shuffledSymbols.slice(0, numSymbols);
                attempts++;

                // If no previous symbols, or we've tried too many times, accept current selection
                if (!previousSymbols || attempts >= maxAttempts) break;

                // Check if symbols match in positions up to min length
                const minLength = Math.min(numSymbols, previousSymbols.length);
                let hasMatch = true;
                for (let i = 0; i < minLength; i++) {
                    if (selectedSymbols[i] !== previousSymbols[i]) {
                        hasMatch = false;
                        break;
                    }
                }

                // If no exact positional match found, we're good
                if (!hasMatch) break;

            } while (attempts < maxAttempts);

            // Create symbol elements
            selectedSymbols.forEach(symbol => {
                const symbolWrapper = document.createElement('span');
                symbolWrapper.classList.add('symbol-shape');
                symbolWrapper.style.fontSize = `${fontSize.toFixed(2)}pt`;
                symbolWrapper.textContent = symbol;

                // Apply mirror effect: flip horizontally
                if (mirrorEffect) {
                    symbolWrapper.style.transform = 'scaleX(-1)';
                    symbolWrapper.style.display = 'inline-block';
                }

                symbolsContainer.appendChild(symbolWrapper);
            });

            row.appendChild(labelDiv);
            row.appendChild(symbolsContainer);
            row.selectedSymbols = selectedSymbols; // Store for next row comparison
            return row;
        }

        function loadAndDisplayChart() {
            const result = loadSettings();

            if (!result.success) {
                chartContainer.innerHTML = `
                    <div class="error-message">
                        <h3>No Settings Found</h3>
                        <p>Please configure chart settings first.</p>
                        <button onclick="window.location.href='logmar-settings.html'">Go to Settings</button>
                    </div>
                `;
                return;
            }

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const symbolColor = settings.letterColor || '#000000';
            const backgroundColor = settings.backgroundColor || '#ffffff';
            const distribution = settings.distribution || 'etdrs';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));
            const mirrorEffect = settings.mirrorEffect || false;

            // Validation
            if (selectedRows.length === 0) {
                chartContainer.innerHTML = '<p style="text-align:center; padding: 40px; color: #666;">No rows selected.</p>';
                return;
            }

            chartContainer.style.backgroundColor = backgroundColor;
            chartContainer.innerHTML = ''; // Clear previous chart

            const sortedRows = [...selectedRows].sort((a, b) => b - a);
            const fontSizes = sortedRows.map(logMAR => calculateFontSize(logMAR, distance, scalingFactor));
            const labelColor = getContrastColor(backgroundColor);

            let previousSymbols = null;
            sortedRows.forEach((logMAR, index) => {
                const nextRowFontSize = index + 1 < fontSizes.length ? fontSizes[index + 1] : null;
                const rowElement = generateSymbolRow(logMAR, distance, scalingFactor, symbolColor, backgroundColor, labelColor, distribution, nextRowFontSize, previousSymbols, mirrorEffect);
                chartContainer.appendChild(rowElement);
                previousSymbols = rowElement.selectedSymbols;
            });
        }

        window.regenerateChart = function () {
            loadAndDisplayChart();
            // Re-apply duochrome if it was enabled
            if (duochromeEnabled) {
                const chartContainer = document.getElementById('chart-container');
                const rows = chartContainer.querySelectorAll('.symbol-row');
                const symbolsContainers = chartContainer.querySelectorAll('.symbols-container');

                if (symbolsContainers.length > 0) {
                    const firstContainer = symbolsContainers[0];
                    const containerRect = chartContainer.getBoundingClientRect();
                    const symbolsRect = firstContainer.getBoundingClientRect();

                    const symbolsCenter = symbolsRect.left + symbolsRect.width / 2 - containerRect.left;
                    const containerWidth = containerRect.width;
                    const centerPercent = (symbolsCenter / containerWidth * 100).toFixed(2);

                    chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                }
                rows.forEach(row => row.style.backgroundColor = 'transparent');
            }
        };

        // Duochrome toggle functionality
        let duochromeEnabled = false;
        const duochromeToggle = document.getElementById('duochrome-toggle');

        duochromeToggle.addEventListener('click', function () {
            duochromeEnabled = !duochromeEnabled;
            const chartContainer = document.getElementById('chart-container');
            const rows = chartContainer.querySelectorAll('.symbol-row');
            const symbolsContainers = chartContainer.querySelectorAll('.symbols-container');

            if (duochromeEnabled) {
                // Calculate where the symbols-container center is relative to chart-container
                if (symbolsContainers.length > 0) {
                    const firstContainer = symbolsContainers[0];
                    const containerRect = chartContainer.getBoundingClientRect();
                    const symbolsRect = firstContainer.getBoundingClientRect();

                    const symbolsCenter = symbolsRect.left + symbolsRect.width / 2 - containerRect.left;
                    const containerWidth = containerRect.width;
                    const centerPercent = (symbolsCenter / containerWidth * 100).toFixed(2);

                    chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                }
                rows.forEach(row => row.style.backgroundColor = 'transparent');
                duochromeToggle.textContent = '🔴🟢 Duochrome: ON';
                duochromeToggle.classList.add('primary');
            } else {
                const result = loadSettings();
                const backgroundColor = result.success ? (result.settings.backgroundColor || '#ffffff') : '#ffffff';
                chartContainer.style.background = backgroundColor;
                rows.forEach(row => row.style.backgroundColor = backgroundColor);
                duochromeToggle.textContent = '🔴🟢 Duochrome: OFF';
                duochromeToggle.classList.remove('primary');
            }
        });

        // Horizontal and Vertical Line Mode functionality
        let currentMode = 'normal';
        let currentLogmarIndex = 0;
        let availableLogmars = [];

        const horizontalLineBtn = document.getElementById('horizontal-line-btn');
        const verticalLineBtn = document.getElementById('vertical-line-btn');
        const largerBtn = document.getElementById('larger-btn');
        const smallerBtn = document.getElementById('smaller-btn');

        horizontalLineBtn.addEventListener('click', function () {
            if (currentMode === 'horizontal') {
                currentMode = 'normal';
                largerBtn.style.display = 'none';
                smallerBtn.style.display = 'none';
                horizontalLineBtn.classList.remove('primary');

                chartContainer.style.display = '';
                chartContainer.style.alignItems = '';
                chartContainer.style.justifyContent = '';
                chartContainer.style.minHeight = '';

                loadAndDisplayChart();

                // Re-apply duochrome if it was enabled
                if (duochromeEnabled) {
                    const rows = chartContainer.querySelectorAll('.symbol-row');
                    const lettersContainers = chartContainer.querySelectorAll('.letters-container');

                    if (lettersContainers.length > 0) {
                        const firstContainer = lettersContainers[0];
                        const containerRect = chartContainer.getBoundingClientRect();
                        const lettersRect = firstContainer.getBoundingClientRect();

                        const lettersCenter = lettersRect.left + lettersRect.width / 2 - containerRect.left;
                        const containerWidth = containerRect.width;
                        const centerPercent = (lettersCenter / containerWidth * 100).toFixed(2);

                        chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                    }
                    rows.forEach(row => row.style.backgroundColor = 'transparent');
                }
            } else {
                currentMode = 'horizontal';
                currentLogmarIndex = 0;
                showHorizontalLine();
                largerBtn.style.display = 'inline-block';
                smallerBtn.style.display = 'inline-block';
                horizontalLineBtn.classList.add('primary');
                verticalLineBtn.classList.remove('primary');
            }
        });

        verticalLineBtn.addEventListener('click', function () {
            if (currentMode === 'vertical') {
                currentMode = 'normal';
                largerBtn.style.display = 'none';
                smallerBtn.style.display = 'none';
                verticalLineBtn.classList.remove('primary');

                chartContainer.style.display = '';
                chartContainer.style.alignItems = '';
                chartContainer.style.justifyContent = '';
                chartContainer.style.minHeight = '';

                loadAndDisplayChart();

                // Re-apply duochrome if it was enabled
                if (duochromeEnabled) {
                    const rows = chartContainer.querySelectorAll('.symbol-row');
                    const lettersContainers = chartContainer.querySelectorAll('.letters-container');

                    if (lettersContainers.length > 0) {
                        const firstContainer = lettersContainers[0];
                        const containerRect = chartContainer.getBoundingClientRect();
                        const lettersRect = firstContainer.getBoundingClientRect();

                        const lettersCenter = lettersRect.left + lettersRect.width / 2 - containerRect.left;
                        const containerWidth = containerRect.width;
                        const centerPercent = (lettersCenter / containerWidth * 100).toFixed(2);

                        chartContainer.style.background = `linear-gradient(to right, #D32F2F 0%, #D32F2F ${centerPercent}%, #388E3C ${centerPercent}%, #388E3C 100%)`;
                    }
                    rows.forEach(row => row.style.backgroundColor = 'transparent');
                }
            } else {
                currentMode = 'vertical';
                showVerticalLine();
                largerBtn.style.display = 'none';
                smallerBtn.style.display = 'none';
                horizontalLineBtn.classList.remove('primary');
                verticalLineBtn.classList.add('primary');
            }
        });

        largerBtn.addEventListener('click', function () {
            if (currentMode === 'horizontal' && currentLogmarIndex > 0) {
                currentLogmarIndex--;
                showHorizontalLine();
            }
        });

        smallerBtn.addEventListener('click', function () {
            if (currentMode === 'horizontal' && currentLogmarIndex < availableLogmars.length - 1) {
                currentLogmarIndex++;
                showHorizontalLine();
            }
        });

        function showHorizontalLine() {
            const result = loadSettings();
            if (!result.success) return;

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const symbolColor = settings.letterColor || '#000000';
            const distribution = settings.distribution || 'etdrs';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));

            if (selectedRows.length === 0) return;

            availableLogmars = [...selectedRows].sort((a, b) => b - a);

            if (currentLogmarIndex >= availableLogmars.length) {
                currentLogmarIndex = availableLogmars.length - 1;
            }

            const targetLogMAR = availableLogmars[currentLogmarIndex];

            chartContainer.innerHTML = '';

            // Handle duochrome mode
            if (duochromeEnabled) {
                chartContainer.style.background = 'linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%)';
            } else {
                chartContainer.style.backgroundColor = '#ffffff';
            }

            chartContainer.style.display = 'flex';
            chartContainer.style.alignItems = 'center';
            chartContainer.style.justifyContent = 'center';
            chartContainer.style.minHeight = '100%';

            const labelColor = '#000000';
            const rowElement = generateSymbolRow(targetLogMAR, distance, scalingFactor, symbolColor, duochromeEnabled ? 'transparent' : '#ffffff', labelColor, distribution, null);
            chartContainer.appendChild(rowElement);
        }

        function showVerticalLine() {
            const result = loadSettings();
            if (!result.success) return;

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const symbolColor = settings.letterColor || '#000000';
            const backgroundColor = settings.backgroundColor || '#ffffff';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));

            if (selectedRows.length === 0) return;

            chartContainer.innerHTML = '';

            // Handle duochrome mode
            if (duochromeEnabled) {
                chartContainer.style.background = 'linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%)';
            } else {
                chartContainer.style.backgroundColor = backgroundColor;
            }

            chartContainer.style.display = 'block';

            const sortedRows = [...selectedRows].sort((a, b) => b - a);
            const labelColor = getContrastColor(backgroundColor);
            const symbols = ['❤️', '🏠', '🌙', '☀️', '🍎', '🚗', '✈️', '⚽'];

            let previousSymbol = null;
            sortedRows.forEach((logMAR, index) => {
                const row = document.createElement('div');
                row.classList.add('symbol-row');
                row.style.backgroundColor = duochromeEnabled ? 'transparent' : backgroundColor;

                const labelDiv = document.createElement('div');
                labelDiv.classList.add('acuity-label');
                labelDiv.style.borderRightColor = labelColor;

                const snellenSpan = document.createElement('span');
                snellenSpan.classList.add('snellen-value');
                const snellenResult = logMarToSnellen(logMAR, distance);
                snellenSpan.textContent = typeof snellenResult === 'string' ? snellenResult : snellenResult.primary;
                snellenSpan.style.color = labelColor;

                const logmarSpan = document.createElement('span');
                logmarSpan.classList.add('logmar-value');
                logmarSpan.textContent = `LogMAR: ${logMAR.toFixed(1)}`;
                logmarSpan.style.color = labelColor;

                labelDiv.appendChild(snellenSpan);
                labelDiv.appendChild(logmarSpan);

                const symbolsContainer = document.createElement('div');
                symbolsContainer.classList.add('symbols-container');

                const fontSize = calculateFontSize(logMAR, distance, scalingFactor);

                // Pick a random symbol different from the previous one
                let randomSymbol;
                let attempts = 0;
                do {
                    randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    attempts++;
                } while (randomSymbol === previousSymbol && attempts < 10);

                previousSymbol = randomSymbol;

                const symbolSpan = document.createElement('span');
                symbolSpan.classList.add('symbol-item');
                symbolSpan.style.fontSize = `${fontSize.toFixed(2)}pt`;
                symbolSpan.textContent = randomSymbol;
                symbolsContainer.appendChild(symbolSpan);

                row.appendChild(labelDiv);
                row.appendChild(symbolsContainer);
                chartContainer.appendChild(row);
            });
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // Ctrl+S to go to settings
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                window.location.href = 'logmar-settings.html';
            }
            // F5 or Ctrl+R to refresh chart
            if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r')) {
                e.preventDefault();
                regenerateChart();
            }
            // Escape to go back
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // Load chart on page load
        loadAndDisplayChart();
    </script>
</body>

</html>
