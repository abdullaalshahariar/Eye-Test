<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: white;
            position: relative;
        }

        #animation-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #animation-media {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(45, 45, 45, 0.8);
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 20px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.2s;
            font-weight: 600;
            z-index: 10;
        }

        .nav-button:hover {
            background: rgba(61, 61, 61, 0.9);
            border-color: var(--primary-color);
        }

        .nav-button.prev {
            left: 20px;
        }

        .nav-button.next {
            right: 20px;
        }

        .animation-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(45, 45, 45, 0.8);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            z-index: 10;
        }

        @media print {

            .header,
            .nav-button,
            .animation-info {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Animation</h1>
        <div class="header-buttons">
            <button onclick="window.history.back()">← Back</button>
        </div>
    </div>

    <div class="content">
        <button class="nav-button prev" onclick="previousAnimation()">←</button>
        <div id="animation-container"></div>
        <button class="nav-button next" onclick="nextAnimation()">→</button>
    </div>

    <script>
        const animations = [
            { name: 'goat2', src: 'videos/Caminandes 2_ Gran Dillama_ - Blender Animated Short_edited.mp4', type: 'video' },
            { name: 'wing_it', src: 'videos/WING IT! - Blender Open Movie.mp4', type: 'video' },
            { name: 'bunny2', src: 'videos/part2.mp4', type: 'video' },
            { name: 'goat3', src: 'videos/Caminandes 3_ Llamigos - Funny 3D Animated Short.mp4', type: 'video' },
            { name: 'deeb', src: 'videos/The Daily Dweebs.mp4', type: 'video' },
            { name: 'goat1', src: 'videos/caminandes-llama-drama.mp4_edited.mkv', type: 'video' },
            { name: 'bunny1', src: 'videos/part1.mkv', type: 'video' }
        ];

        let currentIndex = 0;

        function loadAnimation(index) {
            const container = document.getElementById('animation-container');
            const animation = animations[index];

            container.innerHTML = '';

            if (animation.type === 'video') {
                const video = document.createElement('video');
                video.id = 'animation-media';
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;

                const source = document.createElement('source');
                source.src = animation.src;
                source.type = 'video/mp4';

                video.appendChild(source);
                container.appendChild(video);

                video.play().catch(error => {
                    console.log('Autoplay prevented:', error);
                });
            } else {
                const img = document.createElement('img');
                img.id = 'animation-media';
                img.src = animation.src;
                img.alt = animation.name;
                container.appendChild(img);
            }
        }

        function nextAnimation() {
            currentIndex = (currentIndex + 1) % animations.length;
            loadAnimation(currentIndex);
        }

        function previousAnimation() {
            currentIndex = (currentIndex - 1 + animations.length) % animations.length;
            loadAnimation(currentIndex);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                window.history.back();
            } else if (e.key === 'ArrowRight') {
                nextAnimation();
            } else if (e.key === 'ArrowLeft') {
                previousAnimation();
            }
        });

        // Load first animation on page load
        loadAnimation(currentIndex);
    </script>
</body>

</html>
