<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTV Test - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        #chart-container {
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hotv-row {
            display: flex;
            width: 100%;
            align-items: center;
        }

        .acuity-label {
            padding-left: 10px;
            margin-left: 10px;
            border-left: 1px solid;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 4px;
            width: 80px;
            flex-shrink: 0;
            text-align: left;
            height: 100%;
            order: -1;
        }

        .letters-container {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: center;
            flex-wrap: nowrap;
            overflow: hidden;
            padding: 5px 0;
        }

        .snellen-value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .logmar-value {
            font-size: 0.9em;
        }

        .hotv-letter {
            font-family: 'Optician Sans', Arial, sans-serif;
            font-weight: bold;
            text-align: center;
            flex: 0 0 auto;
            padding: 0 0.3em;
            line-height: 1;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>HOTV Visual Acuity Test</h1>
        <div class="header-buttons">
            <button id="larger-btn">+ Larger</button>
            <button id="smaller-btn">- Smaller</button>
            <button id="duochrome-toggle">🔴🟢 Duochrome: OFF</button>
            <button onclick="window.history.back()">← Back</button>
            <button onclick="regenerateChart()">🔄 Refresh</button>
        </div>
    </div>

    <div class="content">
        <div id="chart-container"></div>
    </div>

    <script type="module">
        import {
            loadSettings,
            calculateFontSize,
            logMarToSnellen,
            shuffleArray
        } from './helpers/logmar3.js';

        const chartContainer = document.getElementById('chart-container');
        const hotvLetters = ['H', 'O', 'T', 'V'];
        let currentLogmarIndex = 0;
        let availableLogmars = [];
        let duochromeEnabled = false;

        function generateHOTVRow(logMAR, distance, scalingFactor, letterColor, backgroundColor, labelColor, mirrorEffect = false) {
            const row = document.createElement('div');
            row.classList.add('hotv-row');
            row.style.backgroundColor = backgroundColor;

            // Acuity Label
            const labelDiv = document.createElement('div');
            labelDiv.classList.add('acuity-label');
            labelDiv.style.borderRightColor = labelColor;

            const snellenSpan = document.createElement('span');
            snellenSpan.classList.add('snellen-value');
            const snellenResult = logMarToSnellen(logMAR, distance);
            snellenSpan.textContent = typeof snellenResult === 'string' ? snellenResult : snellenResult.primary;
            snellenSpan.style.color = labelColor;

            const logmarSpan = document.createElement('span');
            logmarSpan.classList.add('logmar-value');
            logmarSpan.textContent = `LogMAR: ${logMAR.toFixed(1)}`;
            logmarSpan.style.color = labelColor;

            labelDiv.appendChild(snellenSpan);
            labelDiv.appendChild(logmarSpan);

            // Letters Container - single random letter from HOTV
            const lettersContainer = document.createElement('div');
            lettersContainer.classList.add('letters-container');

            // Apply mirror effect: use double distance for calculation (makes letters larger)
            const effectiveDistance = mirrorEffect ? distance * 2 : distance;
            const fontSize = calculateFontSize(logMAR, effectiveDistance, scalingFactor);
            const shuffledChars = shuffleArray([...hotvLetters]);
            const char = shuffledChars[0];

            const letterSpan = document.createElement('span');
            letterSpan.classList.add('hotv-letter');
            letterSpan.style.fontSize = `${fontSize.toFixed(2)}pt`;
            letterSpan.style.color = letterColor;
            letterSpan.textContent = char;

            // Apply mirror effect: flip horizontally
            if (mirrorEffect) {
                letterSpan.style.transform = 'scaleX(-1)';
                letterSpan.style.display = 'inline-block';
            }

            lettersContainer.appendChild(letterSpan);

            row.appendChild(labelDiv);
            row.appendChild(lettersContainer);
            return row;
        }

        function showHorizontalLine() {
            const result = loadSettings();
            if (!result.success) {
                chartContainer.innerHTML = `
                    <div style="text-align:center; padding: 40px; color: #666;">
                        <h3>No Settings Found</h3>
                        <p>Please configure chart settings first.</p>
                        <button onclick="window.location.href='logmar-settings.html'">Go to Settings</button>
                    </div>
                `;
                return;
            }

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const letterColor = settings.letterColor || '#000000';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));
            const mirrorEffect = settings.mirrorEffect || false;

            if (selectedRows.length === 0) {
                chartContainer.innerHTML = '<p style="text-align:center; padding: 40px; color: #666;">No rows selected in settings.</p>';
                return;
            }

            // Sort from largest to smallest (highest logMAR to lowest)
            availableLogmars = [...selectedRows].sort((a, b) => b - a);

            // Ensure index is within bounds
            if (currentLogmarIndex >= availableLogmars.length) {
                currentLogmarIndex = availableLogmars.length - 1;
            }

            const targetLogMAR = availableLogmars[currentLogmarIndex];

            chartContainer.innerHTML = '';

            // Handle duochrome mode
            if (duochromeEnabled) {
                chartContainer.style.background = 'linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%)';
            } else {
                chartContainer.style.background = '#ffffff';
            }

            chartContainer.style.display = 'flex';
            chartContainer.style.alignItems = 'center';
            chartContainer.style.justifyContent = 'center';
            chartContainer.style.minHeight = '100%';

            const labelColor = '#000000';
            const rowElement = generateHOTVRow(targetLogMAR, distance, scalingFactor, letterColor, duochromeEnabled ? 'transparent' : '#ffffff', labelColor, mirrorEffect);
            chartContainer.appendChild(rowElement);
        }

        window.regenerateChart = function () {
            showHorizontalLine();
        };

        // Duochrome toggle functionality
        const duochromeToggle = document.getElementById('duochrome-toggle');
        duochromeToggle.addEventListener('click', function () {
            duochromeEnabled = !duochromeEnabled;

            if (duochromeEnabled) {
                duochromeToggle.textContent = '🔴🟢 Duochrome: ON';
                duochromeToggle.classList.add('primary');
            } else {
                duochromeToggle.textContent = '🔴🟢 Duochrome: OFF';
                duochromeToggle.classList.remove('primary');
                // Clear the gradient background completely
                chartContainer.style.background = '#ffffff';
            }

            showHorizontalLine();
        });

        // Size controls
        const largerBtn = document.getElementById('larger-btn');
        const smallerBtn = document.getElementById('smaller-btn');

        largerBtn.addEventListener('click', function () {
            if (currentLogmarIndex > 0) {
                currentLogmarIndex--;
                showHorizontalLine();
            }
        });

        smallerBtn.addEventListener('click', function () {
            if (currentLogmarIndex < availableLogmars.length - 1) {
                currentLogmarIndex++;
                showHorizontalLine();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // Up arrow for larger
            if (e.key === 'ArrowUp') {
                if (currentLogmarIndex > 0) {
                    currentLogmarIndex--;
                    showHorizontalLine();
                }
            }
            // Down arrow for smaller
            if (e.key === 'ArrowDown') {
                if (currentLogmarIndex < availableLogmars.length - 1) {
                    currentLogmarIndex++;
                    showHorizontalLine();
                }
            }
            // Space or Enter to refresh (get new random letter)
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                regenerateChart();
            }
            // D for duochrome
            if (e.key === 'd' || e.key === 'D') {
                duochromeToggle.click();
            }
            // Escape to go back
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // Load chart on page load
        showHorizontalLine();
    </script>
</body>

</html>
