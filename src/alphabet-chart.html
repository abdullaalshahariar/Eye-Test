<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Chart - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow: auto;
        }

        #chart-container {
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-sizing: border-box;
            min-height: 400px;
        }

        #chart-container:empty::before {
            content: "Loading chart...";
            display: block;
            text-align: center;
            color: #666;
            padding: 50px 20px;
            font-style: italic;
        }

        .alphabet-row {
            display: flex;
            width: 100%;
            align-items: center;
            margin-bottom: 20px;
        }

        .acuity-label {
            padding-right: 15px;
            margin-right: 15px;
            border-right: 1px solid;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            width: 150px;
            flex-shrink: 0;
            text-align: right;
            height: 100%;
        }

        .letters-container {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: center;
            flex-wrap: nowrap;
            overflow: hidden;
            padding: 5px 0;
        }

        .snellen-value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .logmar-value {
            font-size: 0.9em;
        }

        .alphabet-letter {
            font-family: 'Optician Sans', Arial, sans-serif;
            font-weight: bold;
            text-align: center;
            flex: 0 0 auto;
            padding: 0 0.3em;
            line-height: 1;
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: #ef4444;
            background: #fef2f2;
            border-radius: 8px;
            margin: 20px;
        }

        /* Print Styles */
        @media print {
            @page {
                size: A4;
                margin: 15mm;
            }

            body {
                background: #fff !important;
                color: #000 !important;
            }

            .header,
            .error-message {
                display: none !important;
            }

            #chart-container {
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            .alphabet-row {
                page-break-inside: avoid !important;
            }

            .acuity-label {
                border-right-color: #000 !important;
                color: #000 !important;
            }

            .snellen-value,
            .logmar-value {
                color: #000 !important;
            }

            .alphabet-letter {
                color: #000 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Alphabet Visual Acuity Chart</h1>
        <div class="header-buttons">
            <button id="duochrome-toggle">🔴🟢 Duochrome: OFF</button>
            <button onclick="window.history.back()">← Back</button>
            <button onclick="regenerateChart()">🔄 Refresh</button>
        </div>
    </div>

    <div class="content">
        <div id="chart-container"></div>
    </div>

    <script type="module">
        import {
            loadSettings,
            calculateFontSize,
            logMarToSnellen,
            getCharacterSet,
            getContrastColor,
            shuffleArray
        } from './helpers/logmar3.js';

        const chartContainer = document.getElementById('chart-container');

        function generateAlphabetRow(logMAR, distance, characters, scalingFactor, letterColor, backgroundColor, labelColor, nextRowFontSize) {
            const row = document.createElement('div');
            row.classList.add('alphabet-row');
            row.style.backgroundColor = backgroundColor;

            // Acuity Label
            const labelDiv = document.createElement('div');
            labelDiv.classList.add('acuity-label');
            labelDiv.style.borderRightColor = labelColor;

            const snellenSpan = document.createElement('span');
            snellenSpan.classList.add('snellen-value');
            snellenSpan.textContent = logMarToSnellen(logMAR, distance);
            snellenSpan.style.color = labelColor;

            const logmarSpan = document.createElement('span');
            logmarSpan.classList.add('logmar-value');
            logmarSpan.textContent = `LogMAR: ${logMAR.toFixed(1)}`;
            logmarSpan.style.color = labelColor;

            labelDiv.appendChild(snellenSpan);
            labelDiv.appendChild(logmarSpan);

            // Letters Container - Always 5 letters
            const lettersContainer = document.createElement('div');
            lettersContainer.classList.add('letters-container');

            const fontSize = calculateFontSize(logMAR, distance, scalingFactor);

            if (nextRowFontSize) {
                const rowSpacing = nextRowFontSize * 0.75;
                row.style.marginTop = `${rowSpacing}pt`;
            }

            // Always use 5 letters per row
            const lettersPerRow = 5;
            const shuffledChars = shuffleArray([...characters]);
            const charsForRow = [];
            for (let i = 0; i < lettersPerRow; i++) {
                charsForRow.push(shuffledChars[i % shuffledChars.length]);
            }

            // Create letters
            charsForRow.forEach(char => {
                const letterSpan = document.createElement('span');
                letterSpan.classList.add('alphabet-letter');
                letterSpan.style.fontSize = `${fontSize.toFixed(2)}pt`;
                letterSpan.style.color = letterColor;
                letterSpan.style.transform = 'scaleY(1.25)'; // Make letters square (5:5 ratio)
                letterSpan.style.display = 'inline-block';
                letterSpan.textContent = char;
                lettersContainer.appendChild(letterSpan);
            });

            row.appendChild(labelDiv);
            row.appendChild(lettersContainer);
            return row;
        }

        function loadAndDisplayChart() {
            const result = loadSettings();

            if (!result.success) {
                chartContainer.innerHTML = `
                    <div class="error-message">
                        <h3>No Settings Found</h3>
                        <p>Please configure chart settings first.</p>
                        <button onclick="window.location.href='logmar-settings.html'">Go to Settings</button>
                    </div>
                `;
                return;
            }

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const letterSetKey = settings.letterSet || 'ETDRS';
            const customLettersValue = settings.customLetters || '';
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const letterColor = settings.letterColor || '#000000';
            const backgroundColor = settings.backgroundColor || '#ffffff';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));

            // Validation
            if (selectedRows.length === 0) {
                chartContainer.innerHTML = '<p style="text-align:center; padding: 40px; color: #666;">No rows selected.</p>';
                return;
            }

            const characters = getCharacterSet(letterSetKey, customLettersValue);
            if (characters.length === 0) {
                chartContainer.innerHTML = `
                    <div class="error-message">
                        <h3>No Characters Available</h3>
                        <p>Please select or enter valid characters in settings.</p>
                        <button onclick="window.location.href='logmar-settings.html'">Go to Settings</button>
                    </div>
                `;
                return;
            }

            chartContainer.style.backgroundColor = backgroundColor;
            chartContainer.innerHTML = ''; // Clear previous chart

            const sortedRows = [...selectedRows].sort((a, b) => b - a);
            const fontSizes = sortedRows.map(logMAR => calculateFontSize(logMAR, distance, scalingFactor));
            const labelColor = getContrastColor(backgroundColor);

            sortedRows.forEach((logMAR, index) => {
                const nextRowFontSize = index + 1 < fontSizes.length ? fontSizes[index + 1] : null;
                const rowElement = generateAlphabetRow(logMAR, distance, characters, scalingFactor, letterColor, backgroundColor, labelColor, nextRowFontSize);
                chartContainer.appendChild(rowElement);
            });
        }

        window.regenerateChart = function () {
            loadAndDisplayChart();
        };

        // Duochrome toggle functionality
        let duochromeEnabled = false;
        const duochromeToggle = document.getElementById('duochrome-toggle');

        duochromeToggle.addEventListener('click', function () {
            duochromeEnabled = !duochromeEnabled;
            const chartContainer = document.getElementById('chart-container');
            const rows = chartContainer.querySelectorAll('.alphabet-row');

            if (duochromeEnabled) {
                chartContainer.style.background = 'linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%)';
                rows.forEach(row => row.style.backgroundColor = 'transparent');
                duochromeToggle.textContent = '🔴🟢 Duochrome: ON';
                duochromeToggle.classList.add('primary');
            } else {
                const result = loadSettings();
                const backgroundColor = result.success ? (result.settings.backgroundColor || '#ffffff') : '#ffffff';
                chartContainer.style.background = backgroundColor;
                rows.forEach(row => row.style.backgroundColor = backgroundColor);
                duochromeToggle.textContent = '🔴🟢 Duochrome: OFF';
                duochromeToggle.classList.remove('primary');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // F5 or Ctrl+R to refresh chart
            if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r')) {
                e.preventDefault();
                regenerateChart();
            }
            // Escape to go back
            if (e.key === 'Escape') {
                window.history.back();
            }
            // Ctrl+P for print
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                // Let browser handle print
            }
        });

        // Load chart on page load
        loadAndDisplayChart();
    </script>
</body>

</html>
