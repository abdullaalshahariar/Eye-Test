<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsler Grid Test - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }

        .content.normal {
            background: white;
        }

        .content.inverted {
            background: black;
        }

        #test-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .grid-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        #amsler-grid {
            display: block;
        }

        @media print {
            .header {
                display: none !important;
            }

            #test-container {
                width: 100%;
                height: 100vh;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Amsler Grid Test</h1>
        <div class="header-buttons" id="header-buttons">
            <!-- Dynamic buttons will be inserted here -->
        </div>
    </div>

    <div class="content normal" id="content">
        <div id="test-container">
            <div class="grid-container">
                <svg id="amsler-grid"></svg>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            loadSettings,
            calculateFontSize
        } from './helpers/logmar3.js';

        const svg = document.getElementById('amsler-grid');
        const headerButtons = document.getElementById('header-buttons');
        const content = document.getElementById('content');

        // LogMAR values for size control
        const logmarValues = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0, -0.1, -0.2, -0.3];
        let currentLogmarIndex = 6; // Start at 0.4
        let isInverted = false; // Color scheme toggle

        let distance = 6;
        let scalingFactor = 1.0;

        // Dot position (in grid coordinates, 0-20)
        let dotX = 10; // Center
        let dotY = 10; // Center

        function loadCurrentSettings() {
            const result = loadSettings();
            if (result.success) {
                const settings = result.settings;
                distance = parseFloat(settings.distance) || 6;
                scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            }
        }

        function updateButtons() {
            headerButtons.innerHTML = '';

            const backBtn = document.createElement('button');
            backBtn.textContent = '← Back';
            backBtn.onclick = () => {
                window.history.back();
            };
            headerButtons.appendChild(backBtn);

            const invertBtn = document.createElement('button');
            invertBtn.textContent = isInverted ? 'Normal Mode' : 'Invert Colors';
            invertBtn.onclick = toggleInvert;
            headerButtons.appendChild(invertBtn);

            const resetBtn = document.createElement('button');
            resetBtn.textContent = 'Reset Dot';
            resetBtn.onclick = resetDot;
            headerButtons.appendChild(resetBtn);
        }

        function renderGrid() {
            const currentLogmar = logmarValues[currentLogmarIndex];

            // Calculate size based on LogMAR
            const baseFontSize = calculateFontSize(currentLogmar, distance, scalingFactor);

            // Grid size - approximately 10cm viewing angle
            const gridSize = baseFontSize * 10;
            const padding = gridSize * 0.1;

            // Number of grid lines (20x20 grid)
            const gridLines = 20;
            const cellSize = gridSize / gridLines;

            // Line thickness
            const lineThickness = Math.max(1, baseFontSize / 50);

            // Colors based on inversion
            const lineColor = isInverted ? '#FFFFFF' : '#000000';
            const dotColor = isInverted ? '#FFFFFF' : '#000000';

            // SVG size
            const svgSize = gridSize + padding * 2;
            svg.setAttribute('width', svgSize);
            svg.setAttribute('height', svgSize);
            svg.setAttribute('viewBox', `0 0 ${svgSize} ${svgSize}`);

            // Clear previous content
            svg.innerHTML = '';

            const startX = padding;
            const startY = padding;

            // Draw vertical lines
            for (let i = 0; i <= gridLines; i++) {
                const x = startX + i * cellSize;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x);
                line.setAttribute('y1', startY);
                line.setAttribute('x2', x);
                line.setAttribute('y2', startY + gridSize);
                line.setAttribute('stroke', lineColor);
                line.setAttribute('stroke-width', lineThickness);
                svg.appendChild(line);
            }

            // Draw horizontal lines
            for (let i = 0; i <= gridLines; i++) {
                const y = startY + i * cellSize;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', startX);
                line.setAttribute('y1', y);
                line.setAttribute('x2', startX + gridSize);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', lineColor);
                line.setAttribute('stroke-width', lineThickness);
                svg.appendChild(line);
            }

            // Draw center fixation dot
            const dotPixelX = startX + (dotX / gridLines) * gridSize;
            const dotPixelY = startY + (dotY / gridLines) * gridSize;
            const dotRadius = cellSize / 3;

            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', dotPixelX);
            dot.setAttribute('cy', dotPixelY);
            dot.setAttribute('r', dotRadius);
            dot.setAttribute('fill', dotColor);
            svg.appendChild(dot);
        }

        function toggleInvert() {
            isInverted = !isInverted;

            // Update background
            if (isInverted) {
                content.classList.remove('normal');
                content.classList.add('inverted');
            } else {
                content.classList.remove('inverted');
                content.classList.add('normal');
            }

            updateButtons();
            renderGrid();
        }

        function init() {
            loadCurrentSettings();
            updateButtons();
            renderGrid();
        }

        function moveDot(dx, dy) {
            dotX = Math.max(0, Math.min(20, dotX + dx));
            dotY = Math.max(0, Math.min(20, dotY + dy));
            renderGrid();
        }

        function resetDot() {
            dotX = 10;
            dotY = 10;
            renderGrid();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // Arrow keys for dot movement
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                moveDot(-1, 0);
            }
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                moveDot(1, 0);
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                moveDot(0, -1);
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                moveDot(0, 1);
            }
            // Invert colors
            if (e.key === 'i' || e.key === 'I') {
                e.preventDefault();
                toggleInvert();
            }
            // Reset dot position
            if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                resetDot();
            }
            // Go back
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        window.addEventListener('resize', () => {
            renderGrid();
        });

        setTimeout(() => init(), 100);
    </script>
</body>

</html>
