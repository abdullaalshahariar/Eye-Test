<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTV Horizontal Line - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        #test-container {
            background: white;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Line Display */
        .line-display {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
        }

        .line-display.horizontal {
            justify-content: center;
            flex-direction: column;
        }

        .letter-row {
            display: flex;
            width: 100%;
            align-items: center;
            margin-bottom: 5px;
        }

        .acuity-label {
            padding-right: 15px;
            margin-right: 15px;
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            width: 150px;
            flex-shrink: 0;
            text-align: right;
        }

        .letters-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .snellen-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #000;
        }

        .logmar-value {
            font-size: 0.9em;
            color: #333;
        }

        .hotv-letter {
            font-family: 'Optician Sans', Arial, sans-serif;
            font-weight: bold;
            color: #000000;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media print {
            .header {
                display: none !important;
            }

            #test-container {
                width: 100%;
                height: 100vh;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>HOTV Horizontal Line</h1>
        <div class="header-buttons" id="header-buttons">
            <!-- Dynamic buttons will be inserted here -->
        </div>
    </div>

    <div class="content">
        <div id="test-container">
            <div id="display-area"></div>
        </div>
    </div>

    <script type="module">
        import {
            loadSettings,
            calculateFontSize,
            logMarToSnellen
        } from './helpers/logmar3.js';

        const displayArea = document.getElementById('display-area');
        const headerButtons = document.getElementById('header-buttons');

        // LogMAR values for size control
        const logmarValues = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0, -0.1, -0.2, -0.3];
        let currentLogmarIndex = 4; // Start at 0.6 (6/24)

        let distance = 6;
        let scalingFactor = 1.0;

        function loadCurrentSettings() {
            const result = loadSettings();
            if (result.success) {
                const settings = result.settings;
                distance = parseFloat(settings.distance) || 6;
                scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            }
        }

        function updateButtons() {
            headerButtons.innerHTML = '';

            const duochromeBtn = document.createElement('button');
            duochromeBtn.id = 'duochrome-toggle';
            duochromeBtn.textContent = '🔴🟢 Duochrome: OFF';
            duochromeBtn.onclick = toggleDuochrome;
            headerButtons.appendChild(duochromeBtn);

            const backBtn = document.createElement('button');
            backBtn.textContent = '← Back';
            backBtn.onclick = () => {
                window.history.back();
            };
            headerButtons.appendChild(backBtn);

            const largerBtn = document.createElement('button');
            largerBtn.textContent = '+ Larger';
            largerBtn.onclick = increaseSize;
            headerButtons.appendChild(largerBtn);

            const smallerBtn = document.createElement('button');
            smallerBtn.textContent = '- Smaller';
            smallerBtn.onclick = decreaseSize;
            headerButtons.appendChild(smallerBtn);

            const refreshBtn = document.createElement('button');
            refreshBtn.textContent = '🔄 Refresh';
            refreshBtn.onclick = () => {
                renderHorizontalLine();
            };
            headerButtons.appendChild(circlePatternBtn);
        }

        // Duochrome toggle functionality
        let duochromeEnabled = false;

        function toggleDuochrome() {
            duochromeEnabled = !duochromeEnabled;
            const testContainer = document.getElementById('test-container');
            const duochromeBtn = document.getElementById('duochrome-toggle');

            if (duochromeEnabled) {
                testContainer.style.background = 'linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%)';
                duochromeBtn.textContent = '🔴🟢 Duochrome: ON';
                duochromeBtn.classList.add('primary');
            } else {
                testContainer.style.background = 'white';
                duochromeBtn.textContent = '🔴🟢 Duochrome: OFF';
                duochromeBtn.classList.remove('primary');
            }
        }

        function renderHorizontalLine() {
            displayArea.innerHTML = '';
            displayArea.className = '';

            const lineDiv = document.createElement('div');
            lineDiv.className = 'line-display horizontal';

            const currentLogmar = logmarValues[currentLogmarIndex];
            const fontSize = calculateFontSize(currentLogmar, distance, scalingFactor);

            // Create a single row with label
            const rowDiv = document.createElement('div');
            rowDiv.className = 'letter-row';
            rowDiv.style.justifyContent = 'center';

            // Acuity Label
            const labelDiv = document.createElement('div');
            labelDiv.className = 'acuity-label';

            const snellenSpan = document.createElement('div');
            snellenSpan.className = 'snellen-value';
            const snellenResult = logMarToSnellen(currentLogmar, distance);
            snellenSpan.textContent = typeof snellenResult === 'string' ? snellenResult : snellenResult.primary;

            const logmarSpan = document.createElement('span');
            logmarSpan.className = 'logmar-value';
            logmarSpan.textContent = `LogMAR: ${currentLogmar.toFixed(1)}`;

            labelDiv.appendChild(snellenSpan);
            labelDiv.appendChild(logmarSpan);

            // Letters Container
            const lettersContainer = document.createElement('div');
            lettersContainer.className = 'letters-container';

            // Generate 5 unique random letters
            const availableLetters = ['C', 'D', 'E', 'F', 'L', 'O', 'P', 'T', 'Z', 'H', 'N', 'R', 'U', 'V', 'K', 'S'];
            const shuffled = availableLetters.sort(() => Math.random() - 0.5);
            const selectedLetters = shuffled.slice(0, 5);

            selectedLetters.forEach(letter => {
                const letterSpan = document.createElement('span');
                letterSpan.className = 'hotv-letter';
                letterSpan.textContent = letter;
                letterSpan.style.fontSize = `${fontSize}pt`;
                letterSpan.style.transform = 'scaleY(1.25)'; // Make letters square (5:5 ratio)
                letterSpan.style.display = 'inline-block';
                lettersContainer.appendChild(letterSpan);
            });

            rowDiv.appendChild(labelDiv);
            rowDiv.appendChild(lettersContainer);
            lineDiv.appendChild(rowDiv);
            displayArea.appendChild(lineDiv);
        }

        function init() {
            loadCurrentSettings();
            updateButtons();
            renderHorizontalLine();
        }

        function increaseSize() {
            if (currentLogmarIndex > 0) {
                currentLogmarIndex--;
                loadCurrentSettings();
                renderHorizontalLine();
            }
        }

        function decreaseSize() {
            if (currentLogmarIndex < logmarValues.length - 1) {
                currentLogmarIndex++;
                loadCurrentSettings();
                renderHorizontalLine();
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // Arrow Up or + to increase size
            if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') {
                e.preventDefault();
                increaseSize();
            }
            // Arrow Down or - to decrease size
            if (e.key === 'ArrowDown' || e.key === '-') {
                e.preventDefault();
                decreaseSize();
            }
            // F5 or Ctrl+R to refresh
            if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r')) {
                e.preventDefault();
                renderHorizontalLine();
            }
            // Escape to go back
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // Regenerate on window resize
        window.addEventListener('resize', () => {
            renderHorizontalLine();
        });

        // Initial render
        setTimeout(() => init(), 100);
    </script>
</body>

</html>
