<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duochrome Test - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow: auto;
        }

        #chart-container {
            width: 100%;
            padding: 40px;
            border-radius: 10px;
            box-sizing: border-box;
            min-height: 400px;
            position: relative;
            background: linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%);
        }

        #chart-container:empty::before {
            content: "Loading chart...";
            display: block;
            text-align: center;
            color: #666;
            padding: 50px 20px;
            font-style: italic;
        }

        .letter-row {
            display: flex;
            width: 100%;
            align-items: center;
            margin-bottom: 5px;
            position: relative;
            justify-content: center;
        }

        .acuity-label {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            padding-right: 15px;
            margin-right: 15px;
            border-right: 1px solid;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            width: 150px;
            flex-shrink: 0;
            text-align: right;
            z-index: 10;
        }

        .letters-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: nowrap;
            width: 100%;
        }

        .snellen-value {
            font-size: 1.1em;
            font-weight: bold;
            color: white;
        }

        .logmar-value {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
        }

        .letter {
            font-family: 'Optician Sans', Arial, sans-serif;
            font-weight: bold;
            color: #000000;
            user-select: none;
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: #ef4444;
            background: #fef2f2;
            border-radius: 8px;
            margin: 20px;
        }

        /* Print Styles */
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }

            body {
                background: #fff !important;
                color: #000 !important;
            }

            .header,
            .error-message {
                display: none !important;
            }

            #chart-container {
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            .letter-row {
                page-break-inside: avoid !important;
            }

            .acuity-label {
                border-right-color: #fff !important;
                color: #fff !important;
            }

            .snellen-value,
            .logmar-value {
                color: #fff !important;
            }

            .letter {
                color: #000 !important;
            }

            #chart-container {
                background: linear-gradient(to right, #D32F2F 0%, #D32F2F 50%, #388E3C 50%, #388E3C 100%) !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Duochrome Test (Red-Green)</h1>
        <div class="header-buttons">
            <button onclick="window.history.back()">← Back</button>
            <button onclick="regenerateChart()">🔄 Refresh</button>
        </div>
    </div>

    <div class="content">
        <div id="chart-container"></div>
    </div>

    <script type="module">
        import {
            loadSettings,
            calculateFontSize,
            logMarToSnellen,
            shuffleArray
        } from './helpers/logmar3.js';

        const chartContainer = document.getElementById('chart-container');

        const LETTERS = ['C', 'D', 'E', 'F', 'L', 'O', 'P', 'T', 'Z',
            'H', 'N', 'P', 'R', 'U', 'V', 'K', 'D', 'C', 'Z', 'S'];

        function generateLetterRow(logMAR, distance, scalingFactor, letterColor, labelColor, distribution, nextRowFontSize) {
            const row = document.createElement('div');
            row.classList.add('letter-row');

            // Acuity Label
            const labelDiv = document.createElement('div');
            labelDiv.classList.add('acuity-label');
            labelDiv.style.borderRightColor = labelColor;

            const snellenSpan = document.createElement('span');
            snellenSpan.classList.add('snellen-value');
            const snellenResult = logMarToSnellen(logMAR, distance);
            snellenSpan.textContent = typeof snellenResult === 'string' ? snellenResult : snellenResult.primary;

            const logmarSpan = document.createElement('span');
            logmarSpan.classList.add('logmar-value');
            logmarSpan.textContent = `LogMAR: ${logMAR.toFixed(1)}`;

            labelDiv.appendChild(snellenSpan);
            labelDiv.appendChild(logmarSpan);

            // Letters Container
            const lettersContainer = document.createElement('div');
            lettersContainer.classList.add('letters-container');

            const fontSize = calculateFontSize(logMAR, distance, scalingFactor);

            if (nextRowFontSize) {
                const rowSpacing = nextRowFontSize * 0.75;
                row.style.marginTop = `${rowSpacing}pt`;
            }

            // Determine number of letters based on distribution
            let numLetters;
            if (distribution === 'snellen') {
                if (logMAR >= 0.8) numLetters = 1;
                else if (logMAR >= 0.6) numLetters = 2;
                else if (logMAR >= 0.4) numLetters = 3;
                else if (logMAR >= 0.2) numLetters = 4;
                else numLetters = 5;
            } else if (distribution === 'etdrs') {
                numLetters = 5;
            } else if (distribution === 'linear') {
                numLetters = Math.max(1, Math.round((1.0 - logMAR) * 5) + 1);
                numLetters = Math.min(numLetters, 6);
            } else {
                numLetters = 5;
            }

            // Shuffle and select letters
            const shuffledLetters = shuffleArray([...LETTERS]);
            const selectedLetters = shuffledLetters.slice(0, numLetters);

            // Create letter elements
            selectedLetters.forEach(letter => {
                const letterSpan = document.createElement('span');
                letterSpan.classList.add('letter');
                letterSpan.textContent = letter;
                letterSpan.style.fontSize = `${fontSize}pt`;
                letterSpan.style.color = letterColor;
                lettersContainer.appendChild(letterSpan);
            });

            row.appendChild(labelDiv);
            row.appendChild(lettersContainer);
            return row;
        }

        function loadAndDisplayChart() {
            const result = loadSettings();

            if (!result.success) {
                chartContainer.innerHTML = `
                    <div class="error-message">
                        <h3>No Settings Found</h3>
                        <p>Please configure chart settings first.</p>
                        <button onclick="window.location.href='logmar-settings.html'">Go to Settings</button>
                    </div>
                `;
                return;
            }

            const settings = result.settings;
            const distance = parseFloat(settings.distance) || 6;
            const scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            const letterColor = '#000000'; // Black letters on both backgrounds
            const distribution = settings.distribution || 'etdrs';
            const selectedRows = (settings.selectedRows || []).map(v => parseFloat(v));

            // Validation
            if (selectedRows.length === 0) {
                chartContainer.innerHTML = '<p style="text-align:center; padding: 40px; color: #666;">No rows selected.</p>';
                return;
            }

            chartContainer.innerHTML = ''; // Clear previous chart

            const sortedRows = [...selectedRows].sort((a, b) => b - a);
            const fontSizes = sortedRows.map(logMAR => calculateFontSize(logMAR, distance, scalingFactor));
            const labelColor = 'white';

            // Generate rows with full width
            sortedRows.forEach((logMAR, index) => {
                const nextRowFontSize = index + 1 < fontSizes.length ? fontSizes[index + 1] : null;
                const row = generateLetterRow(logMAR, distance, scalingFactor, letterColor, labelColor, distribution, nextRowFontSize);
                chartContainer.appendChild(row);
            });
        }

        window.regenerateChart = function () {
            loadAndDisplayChart();
        };

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // Ctrl+S to go to settings
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                window.location.href = 'logmar-settings.html';
            }
            // F5 or Ctrl+R to refresh chart
            if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r')) {
                e.preventDefault();
                regenerateChart();
            }
            // Escape to go back
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // Load chart on page load
        loadAndDisplayChart();
    </script>
</body>

</html>
