<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTV Test - Eye Clinic</title>
    <link rel="stylesheet" href="chart-styles.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --text-color: #dcddde;
            --background-color: #1e1e1e;
            --container-bg: #252525;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: var(--container-bg);
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #3d3d3d;
            border-color: var(--primary-color);
        }

        button.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #6d28d9;
        }

        .content {
            flex: 1;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        #test-container {
            background: white;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .size-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            z-index: 100;
            display: block;
        }

        /* Circle Pattern */
        .circle-pattern {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 0;
            padding: 40px;
            box-sizing: border-box;
        }

        .hotv-letter {
            font-family: 'Optician Sans', Arial, sans-serif;
            font-weight: bold;
            color: #000000;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hotv-letter.center {
            grid-column: 3;
            grid-row: 3;
        }

        .hotv-letter.pos-top {
            grid-column: 3;
            grid-row: 1;
        }

        .hotv-letter.pos-top-right {
            grid-column: 5;
            grid-row: 2;
        }

        .hotv-letter.pos-bottom-right {
            grid-column: 5;
            grid-row: 4;
        }

        .hotv-letter.pos-bottom {
            grid-column: 3;
            grid-row: 5;
        }

        .hotv-letter.pos-bottom-left {
            grid-column: 1;
            grid-row: 4;
        }

        .hotv-letter.pos-top-left {
            grid-column: 1;
            grid-row: 2;
        }

        /* Single Letter Display */
        .single-letter-display {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .single-letter {
            font-family: 'Optician Sans', Arial, sans-serif;
            font-weight: bold;
            color: #000000;
            user-select: none;
        }

        /* Line Display */
        .line-display {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
        }

        .line-display.horizontal {
            justify-content: center;
            flex-direction: column;
        }

        .line-display.vertical {
            justify-content: center;
            flex-direction: row;
        }

        .letter-row {
            display: flex;
            width: 100%;
            align-items: center;
            margin-bottom: 5px;
        }

        .acuity-label {
            padding-right: 15px;
            margin-right: 15px;
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            width: 150px;
            flex-shrink: 0;
            text-align: right;
        }

        .letters-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .snellen-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #000;
        }

        .logmar-value {
            font-size: 0.9em;
            color: #333;
        }

        @media print {
            .header {
                display: none !important;
            }

            #test-container {
                width: 100%;
                height: 100vh;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>HOTV Test</h1>
        <div class="header-buttons" id="header-buttons">
            <!-- Dynamic buttons will be inserted here -->
        </div>
    </div>

    <div class="content">
        <div id="test-container">
            <div class="size-indicator" id="size-indicator"></div>
            <div id="display-area"></div>
        </div>
    </div>

    <script type="module">
        import {
            loadSettings,
            calculateFontSize,
            logMarToSnellen
        } from './helpers/logmar3.js';

        const displayArea = document.getElementById('display-area');
        const sizeIndicator = document.getElementById('size-indicator');
        const headerButtons = document.getElementById('header-buttons');

        const HOTV_LETTERS = ['H', 'O', 'T', 'V'];

        // LogMAR values for size control
        const logmarValues = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0, -0.1, -0.2, -0.3];
        let currentLogmarIndex = 4; // Start at 0.6 (6/24)

        let distance = 6;
        let scalingFactor = 1.0;

        function loadCurrentSettings() {
            const result = loadSettings();
            if (result.success) {
                const settings = result.settings;
                distance = parseFloat(settings.distance) || 6;
                scalingFactor = parseFloat(settings.scalingFactor) || 1.0;
            }
        }

        function updateSizeIndicator() {
            const currentLogmar = logmarValues[currentLogmarIndex];
            const snellen = logMarToSnellen(currentLogmar, distance);
            sizeIndicator.textContent = snellen;
        }

        function updateButtons() {
            headerButtons.innerHTML = '';

            const backBtn = document.createElement('button');
            backBtn.textContent = '← Back';
            backBtn.onclick = () => {
                window.history.back();
            };
            headerButtons.appendChild(backBtn);

            const largerBtn = document.createElement('button');
            largerBtn.textContent = '+ Larger';
            largerBtn.onclick = increaseSize;
            headerButtons.appendChild(largerBtn);

            const smallerBtn = document.createElement('button');
            smallerBtn.textContent = '- Smaller';
            smallerBtn.onclick = decreaseSize;
            headerButtons.appendChild(smallerBtn);

            const refreshBtn = document.createElement('button');
            refreshBtn.textContent = '🔄 Refresh';
            refreshBtn.onclick = () => {
                renderCirclePattern();
            };
            headerButtons.appendChild(refreshBtn);

            const horizontalLineBtn = document.createElement('button');
            horizontalLineBtn.textContent = 'Horizontal Line';
            horizontalLineBtn.onclick = () => {
                window.location.href = 'hotv-horizontal.html';
            };
            headerButtons.appendChild(horizontalLineBtn);

            const verticalLineBtn = document.createElement('button');
            verticalLineBtn.textContent = 'Vertical Lines';
            verticalLineBtn.onclick = () => {
                window.location.href = 'hotv-vertical.html';
            };
            headerButtons.appendChild(verticalLineBtn);

            const singleLetterBtn = document.createElement('button');
            singleLetterBtn.textContent = 'Single Letter';
            singleLetterBtn.onclick = () => {
                window.location.href = 'hotv-single.html';
            };
            headerButtons.appendChild(singleLetterBtn);
        }

        function renderCirclePattern() {
            displayArea.innerHTML = '';
            displayArea.className = '';
            sizeIndicator.style.display = 'block';

            const circleDiv = document.createElement('div');
            circleDiv.className = 'circle-pattern';

            const currentLogmar = logmarValues[currentLogmarIndex];
            const fontSize = calculateFontSize(currentLogmar, distance, scalingFactor);

            // Generate 7 unique letters (no duplicates) using LogMAR letter pool
            const selectedLetters = [];
            let availableLetters = ['C', 'D', 'E', 'F', 'L', 'O', 'P', 'T', 'Z', 'H', 'N', 'R', 'U', 'V', 'K', 'S'];

            for (let i = 0; i < 7; i++) {
                // Pick a random index from available letters
                const randomIndex = Math.floor(Math.random() * availableLetters.length);
                const selectedLetter = availableLetters[randomIndex];

                // Add to selected
                selectedLetters.push(selectedLetter);

                // Remove from available (create new array without this letter)
                const newAvailable = [];
                for (let j = 0; j < availableLetters.length; j++) {
                    if (j !== randomIndex) {
                        newAvailable.push(availableLetters[j]);
                    }
                }
                availableLetters = newAvailable;
            }

            // Position classes for 5x5 grid
            const positions = [
                'pos-top',           // Row 0, Col 2
                'pos-top-right',     // Row 1, Col 4
                'pos-bottom-right',  // Row 3, Col 4
                'pos-bottom',        // Row 4, Col 2
                'pos-bottom-left',   // Row 3, Col 0
                'pos-top-left'       // Row 1, Col 0
            ];

            // Create 6 letters around in circle positions
            for (let i = 0; i < 6; i++) {
                const letterSpan = document.createElement('div');
                letterSpan.className = `hotv-letter ${positions[i]}`;
                letterSpan.textContent = selectedLetters[i];
                letterSpan.style.fontSize = `${fontSize}pt`;
                circleDiv.appendChild(letterSpan);
            }

            // Center letter (Row 2, Col 2)
            const centerLetter = document.createElement('div');
            centerLetter.className = 'hotv-letter center';
            centerLetter.textContent = selectedLetters[6];
            centerLetter.style.fontSize = `${fontSize}pt`;
            circleDiv.appendChild(centerLetter);

            displayArea.appendChild(circleDiv);
        }

        function init() {
            loadCurrentSettings();
            updateSizeIndicator();
            updateButtons();
            sizeIndicator.style.display = 'block';
            renderCirclePattern();
        } function increaseSize() {
            if (currentLogmarIndex > 0) {
                currentLogmarIndex--;
                loadCurrentSettings();
                updateSizeIndicator();
                renderCirclePattern();
            }
        }

        function decreaseSize() {
            if (currentLogmarIndex < logmarValues.length - 1) {
                currentLogmarIndex++;
                loadCurrentSettings();
                updateSizeIndicator();
                renderCirclePattern();
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // Arrow Up or + to increase size
            if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') {
                e.preventDefault();
                increaseSize();
            }
            // Arrow Down or - to decrease size
            if (e.key === 'ArrowDown' || e.key === '-') {
                e.preventDefault();
                decreaseSize();
            }
            // F5 or Ctrl+R to refresh
            if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r')) {
                e.preventDefault();
                renderCirclePattern();
            }
            // Escape to go back
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // Regenerate on window resize
        window.addEventListener('resize', () => {
            renderCirclePattern();
        });

        // Initial render
        setTimeout(() => init(), 100);
    </script>
</body>

</html>
